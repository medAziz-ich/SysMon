<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYSMON · Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #070d14;
      font-family: 'Share Tech Mono', monospace;
      color: #e0fff8;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,255,200,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,200,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    .corner { position: fixed; width: 24px; height: 24px; border-color: #00ffc8; border-style: solid; border-width: 0; z-index: 1; }
    .corner.tl { top: 28px; left: 28px; border-top-width: 2px; border-left-width: 2px; }
    .corner.tr { top: 28px; right: 28px; border-top-width: 2px; border-right-width: 2px; }
    .corner.bl { bottom: 28px; left: 28px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 28px; right: 28px; border-bottom-width: 2px; border-right-width: 2px; }

    .global-clock {
      position: fixed; top: 22px; right: 56px;
      font-size: 11px; color: rgba(0,255,200,0.45);
      letter-spacing: 0.12em; z-index: 2;
    }

    .panel {
      position: relative; z-index: 2;
      width: 420px;
      border: 1px solid rgba(0,255,200,0.22);
      background: rgba(7,20,30,0.94);
      padding: 44px 40px 38px;
      animation: fadeIn 0.6s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #00ffc8 40%, transparent);
    }

    .header-tag { font-size: 10px; color: #00ffc8; letter-spacing: 0.28em; opacity: 0.65; margin-bottom: 7px; }
    .logo { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; color: #00ffc8; letter-spacing: 0.1em; margin-bottom: 3px; }
    .logo span { color: #ffffff; }
    .subtitle { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 0.22em; margin-bottom: 36px; }

    .field-label { font-size: 10px; letter-spacing: 0.22em; color: rgba(0,255,200,0.55); margin-bottom: 8px; }

    .field-wrap { position: relative; margin-bottom: 20px; }

    .field-wrap input {
      width: 100%;
      background: rgba(0,255,200,0.03);
      border: 1px solid rgba(0,255,200,0.18);
      color: #e0fff8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      padding: 11px 38px 11px 13px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field-wrap input::placeholder { color: rgba(255,255,255,0.13); }
    .field-wrap input:focus { border-color: #00ffc8; background: rgba(0,255,200,0.05); }

    .field-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: rgba(0,255,200,0.35); font-size: 13px; pointer-events: none; }

    .divider { border: none; border-top: 1px solid rgba(0,255,200,0.09); margin: 10px 0 24px; }

    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }

    .remember {
      display: flex; align-items: center; gap: 9px;
      font-size: 10px; color: rgba(255,255,255,0.38);
      cursor: pointer; user-select: none; letter-spacing: 0.1em;
    }
    .remember input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 13px; height: 13px;
      border: 1px solid rgba(0,255,200,0.28); background: transparent;
      cursor: pointer; position: relative; flex-shrink: 0;
    }
    .remember input[type="checkbox"]:checked { background: #00ffc8; border-color: #00ffc8; }
    .remember input[type="checkbox"]:checked::after {
      content: ''; position: absolute; top: 2px; left: 3px;
      width: 5px; height: 3px;
      border-left: 1.5px solid #070d14; border-bottom: 1.5px solid #070d14;
      transform: rotate(-45deg);
    }

    .error-msg {
      display: none; font-size: 10px; color: #ff4d6d;
      letter-spacing: 0.12em; margin-top: -14px; margin-bottom: 18px;
    }

    .btn-action {
      width: 100%; background: #00ffc8; border: none; color: #070d14;
      font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 700;
      letter-spacing: 0.22em; padding: 13px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover  { background: #00e6b4; }
    .btn-action:active { background: #00cca0; }

    .status-bar {
      display: flex; align-items: center; gap: 9px;
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid rgba(0,255,200,0.07);
      font-size: 10px; color: rgba(255,255,255,0.22); letter-spacing: 0.15em;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #00ffc8; flex-shrink: 0; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
      40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }

    .success-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(7,20,30,0.97);
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700;
      color: #00ffc8; letter-spacing: 0.2em; text-align: center;
    }
    .success-sub { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: rgba(0,255,200,0.5); letter-spacing: 0.2em; }

    .default-hint {
      font-size: 10px; color: rgba(255,200,0,0.6);
      letter-spacing: 0.12em; margin-bottom: 20px;
      padding: 8px 12px;
      border: 1px solid rgba(255,200,0,0.2);
      background: rgba(255,200,0,0.04);
      display: none;
    }
  </style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="global-clock" id="globalClock"></div>

  <div class="panel" id="panel">

    <div class="success-overlay" id="successOverlay">
      <div>ACCESS GRANTED</div>
      <div class="success-sub">REDIRECTING TO DASHBOARD...</div>
    </div>

    <div class="header-tag">// SECURE AUTH PORTAL</div>
    <div class="logo">SYS<span>MON</span></div>
    <div class="subtitle">AGENT DASHBOARD &middot; ADMIN ACCESS</div>

    <div class="default-hint" id="defaultHint">
      ⚠ DEFAULT CREDENTIALS ACTIVE &mdash; CHANGE PASSWORD AFTER LOGIN
    </div>

    <div class="field-label">// IDENTIFIER</div>
    <div class="field-wrap">
      <input type="email" id="loginUser" placeholder="admin@sysmon.local"
             autocomplete="off" spellcheck="false" />
      <span class="field-icon">&#9656;</span>
    </div>

    <div class="field-label">// AUTH KEY</div>
    <div class="field-wrap">
      <input type="password" id="loginPass" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
             autocomplete="off" />
      <span class="field-icon">&#9656;</span>
    </div>

    <div class="error-msg" id="loginErr"></div>

    <hr class="divider" />

    <div class="row">
      <label class="remember">
        <input type="checkbox" />
        REMEMBER SESSION
      </label>
    </div>

    <button class="btn-action" onclick="attemptLogin()">AUTHENTICATE</button>

    <div class="status-bar">
      <div class="dot"></div>
      <span id="sysStatus">SYSTEM ONLINE</span>
    </div>

  </div>

  <script>
    // Clock
    function tick() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('globalClock').textContent =
        now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
        ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    }
    tick(); setInterval(tick, 1000);

    // Show default-credentials hint if using admin@sysmon.local
    document.getElementById('loginUser').addEventListener('input', function() {
      const hint = document.getElementById('defaultHint');
      hint.style.display = this.value === 'admin@sysmon.local' ? 'block' : 'none';
    });

    function shake(msg) {
      const err = document.getElementById('loginErr');
      const panel = document.getElementById('panel');
      err.textContent = '⚠ ' + msg;
      err.style.display = 'block';
      panel.classList.remove('shake');
      void panel.offsetWidth;
      panel.classList.add('shake');
    }

    async function attemptLogin() {
      const email = document.getElementById('loginUser').value.trim();
      const pass  = document.getElementById('loginPass').value;
      if (!email || !pass) return shake('IDENTIFIER AND AUTH KEY REQUIRED');

      try {
        // FastAPI-Users expects OAuth2 form data: username + password
        const form = new URLSearchParams();
        form.append('username', email);
        form.append('password', pass);

        const res = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body:    form.toString(),
        });

        if (res.status === 204 || res.ok) {
          document.getElementById('loginErr').style.display = 'none';
          document.getElementById('successOverlay').style.display = 'flex';
          // Small delay lets the browser commit the Set-Cookie header
          // before we navigate — without this the dashboard sees no session
          setTimeout(() => { window.location.replace('/'); }, 800);
        } else {
          const data = await res.json().catch(() => ({}));
          document.getElementById('loginPass').value = '';
          shake(data.detail || 'AUTHENTICATION FAILED — ACCESS DENIED');
        }
      } catch (e) {
        shake('SERVER UNREACHABLE');
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') attemptLogin();
    });
  </script>

</body>
</html>
